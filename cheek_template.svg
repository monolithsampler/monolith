ond is a mirror image).</text><text x="5" y="129.6050847414604" font-size="3.4">Rod hole (inner face only, 12 mm deep): 274.5 mm from the front edge, 90.1 mm up. Screw pilots 3 mm, 17 mm deep, from the inner face. Nothing goes through to the outer face.</text></svg>